[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend: upload medical documents and ask questions about them"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
    "langchain-openai",
    "langchain-chroma",
    "langchain-text-splitters",
    "pypdf",
    "boto3",
]

[tool.uv]
package = false
