# Local:  docker compose up --build      -> app at http://localhost:8501, API docs at http://localhost:8000/docs
# On AWS the GitHub workflow sets ECR_REGISTRY and IMAGE_TAG so the images are named for Amazon ECR.
name: medical-diagnostics

services:
  backend:
    build: ./backend
    image: ${ECR_REGISTRY:-local}/medical-diagnostics-backend:${IMAGE_TAG:-latest}
    env_file: .env
    volumes:
      - vector_db:/app/vector_db # keeps the uploaded documents' embeddings between restarts
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ${ECR_REGISTRY:-local}/medical-diagnostics-frontend:${IMAGE_TAG:-latest}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vector_db:
