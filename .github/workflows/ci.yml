name: CI

# Runs on self-hosted runners by default. Set the repository variable CI_RUNS_ON to a JSON
# label list to change that, e.g. '["self-hosted","linux","builder"]' or '"ubuntu-latest"'.

on:
  pull_request:
  workflow_call: # reused by the CD workflow before publishing images
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux"]') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -v

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux"]') }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build + smoke test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux"]') }}
    needs: [backend, frontend]
    env:
      # Isolated from the production stack, which may run on the same self-hosted machine:
      # a unique project name (so `down -v` can't touch prod containers or volumes) and
      # host ports that don't collide with prod (:80).
      COMPOSE_PROJECT_NAME: mdx-ci-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_PORT: "18080"
      BACKEND_PORT: "18000"
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke test through the frontend proxy
        run: |
          curl --fail --silent "http://localhost:${FRONTEND_PORT}/" | grep -q '<div id="root">'
          curl --fail --silent "http://localhost:${FRONTEND_PORT}/api/v1/health" | grep -q '"ok"'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
