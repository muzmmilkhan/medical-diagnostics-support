name: CD

# Build -> push to Amazon ECR -> deploy on EC2 with docker compose.
# The deploy job runs on a self-hosted runner installed on the EC2 instance itself (label
# "production"), so no SSH access or SSH keys are needed. See deploy/README.md.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  # Non-sensitive settings: read from repository *variables*, falling back to secrets.
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || 'medical-diagnostics-backend' }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY || 'medical-diagnostics-frontend' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Push ${{ matrix.service }} image to ECR
    needs: ci
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","linux"]') }}
    environment: production
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (CI deploy IAM user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ matrix.service == 'backend' && env.ECR_BACKEND_REPOSITORY || env.ECR_FRONTEND_REPOSITORY }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          # Must match the EC2 CPU: linux/amd64 (t3, m6i, ...) or linux/arm64 (Graviton t4g, m7g, ...).
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy on EC2
    needs: publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # Must be the runner on the production instance; the stack is started on this machine.
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNS_ON || '["self-hosted","linux","production"]') }}
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (CI deploy IAM user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Logs the local Docker daemon in to ECR; the action logs out again in its post step.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Render runtime configuration
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || secrets.S3_BUCKET_NAME }}
          APP_AWS_ACCESS_KEY_ID: ${{ secrets.APP_AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}
        run: |
          : "${OPENAI_API_KEY:?Set the OPENAI_API_KEY secret}"
          umask 077
          mkdir -p bundle
          cp deploy/docker-compose.prod.yml bundle/docker-compose.yml

          # Compose interpolation: which images to run.
          {
            echo "BACKEND_IMAGE=${REGISTRY}/${ECR_BACKEND_REPOSITORY}:${GITHUB_SHA}"
            echo "FRONTEND_IMAGE=${REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${GITHUB_SHA}"
          } > bundle/.env

          # Backend container environment.
          {
            echo "ENVIRONMENT=production"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "AWS_REGION=${AWS_REGION}"
            [ -n "$OPENAI_MODEL" ] && echo "OPENAI_MODEL=${OPENAI_MODEL}"
            [ -n "$S3_BUCKET_NAME" ] && echo "S3_BUCKET_NAME=${S3_BUCKET_NAME}"
            # Omit the app keys to fall back to the EC2 instance profile (IAM role).
            [ -n "$APP_AWS_ACCESS_KEY_ID" ] && echo "AWS_ACCESS_KEY_ID=${APP_AWS_ACCESS_KEY_ID}"
            [ -n "$APP_AWS_SECRET_ACCESS_KEY" ] && echo "AWS_SECRET_ACCESS_KEY=${APP_AWS_SECRET_ACCESS_KEY}"
            true
          } > bundle/app.env

      - name: Deploy with docker compose
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          # Outside the runner workspace, so workspace cleanup never touches the live config.
          DEPLOY_DIR="${DEPLOY_PATH:-$HOME/medical-diagnostics}"
          mkdir -p "$DEPLOY_DIR"
          install -m 644 bundle/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          install -m 600 bundle/.env "$DEPLOY_DIR/.env"
          install -m 600 bundle/app.env "$DEPLOY_DIR/app.env"

          cd "$DEPLOY_DIR"
          docker compose pull
          if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
            docker compose ps
            docker compose logs --tail 100
            exit 1
          fi
          docker compose ps

      - name: Verify health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://localhost/api/v1/health

      - name: Prune old images and build cache
        run: |
          docker image prune -af --filter "until=168h" >/dev/null
          docker builder prune -f --filter "until=168h" >/dev/null

      - name: Clean up
        if: always()
        run: rm -rf bundle
