# On every push to main: build the Docker images, push them to Amazon ECR, and start the app on EC2.
# It runs on a self-hosted GitHub runner installed on the EC2 instance.
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create .env file from GitHub secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=$OPENAI_API_KEY
          S3_BUCKET_NAME=$S3_BUCKET_NAME
          AWS_REGION=$AWS_REGION
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          EOF

      - name: Build, push to ECR, and start the app
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose build
          docker compose push
          docker compose up -d
          docker image prune -f
